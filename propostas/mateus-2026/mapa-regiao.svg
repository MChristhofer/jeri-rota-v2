 <linearGradient id="areia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe4c5"/><stop offset="1" stop-color="#e3d3ac"/></linearGradient>
 <linearGradient id="lagoa" x1="0" x2=".8" y1="0" y2="1"><stop offset="0" stop-color="#3aa8a6"/><stop offset=".6" stop-color="#68c7c4"/><stop offset="1" stop-color="#bbdfca"/></linearGradient>
 <radialGradient id="terra"><stop offset="0" stop-color="#d1d1ad"/><stop offset="1" stop-color="#e8d9b8"/></radialGradient>
 <filter id="shadow" x="-20%" y="-40%" width="150%" height="190%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0a2936" flood-opacity=".16"/></filter>
