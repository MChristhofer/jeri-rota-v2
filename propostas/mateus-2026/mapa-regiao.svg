<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl desc">
<title id="ttl">Mapa regional ilustrado de Jericoacoara e roteiros Jeri Rota</title><desc id="desc">Mapa com costa, mar, dunas e lagoas. Jericoacoara é a base; Guriú, Mangue Seco e Tatajuba a oeste; Lagoa Azul, Buraco Azul e Lagun Beach a leste; Alchymist/Lagoa do Paraíso ao sudeste; Barrinha a leste. Localizações aproximadas.</desc>
