name: Publicar fotos nítidas Ilisandra
on:
  push:
    paths:
      - .github/workflows/publicar-fotos-nitidas-ilisandra.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install pillow
      - name: Baixar fotografias em alta resolução
        env:
          URL_DUPLO: "https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F2dc6f6df-8c2b-49d4-b237-7ac9e31f7e5b/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADqgdc9SWjSrFON6_Hfo-WdbaIgNYseFqUT5KtisednM&exp=1794333071&osig=AAAAAAAAAAAAAAAAAAAAADx_Prp7ZCdkLP4fPtczlRtK4k_NcmYeigPsv9lMgGd-&signer=media-rpc&token=AAIAAU0AJDJkYzZmNmRmLThjMmItNDlkNC1iMjM3LTdhYzllMzFmN2U1YgAAAAABocaV1pg4D472B6Fho7UAE9aY3EnuayQxgr-Hy7cq9QD1DDecfg&x-canva-quality=thumbnail"
          URL_TRIPLO: "https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F75faf609-e7d8-417f-a137-9f5895de89fa/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFNYRLR_zG7LW0jBiMO-Qe2siZREoswM5_HYJ3xffEdA&exp=1794329915&osig=AAAAAAAAAAAAAAAAAAAAAJl89mAkGMFACa6OWby9Oigadp_YOfgurubgrzxA9C8-&signer=media-rpc&token=AAIAAU0AJDc1ZmFmNjA5LWU3ZDgtNDE3Zi1hMTM3LTlmNTg5NWRlODlmYQAAAAABocZlrng_9N1NUhHSMbPx4YlEuPL1OvWiuoXR6SYtJVtEBsvmRQ&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
          import os, re, io, pathlib, urllib.request
          from PIL import Image
          from urllib.error import HTTPError
          d=pathlib.Path("propostas/ilisandra")
          for name,envkey in (("quarto-duplo", "URL_DUPLO"),("quarto-triplo","URL_TRIPLO")):
              original=os.environ[envkey]
              paths=[
                  original.replace('height:112','height:941').replace('width:200','width:1672'),
                  original.replace('height:112','height:675').replace('width:200','width:1200'),
                  original.replace('height:112','height:450').replace('width:200','width:800'),
              ]
              paths += [s.replace('&x-canva-quality=thumbnail','') for s in paths]
              paths.append(original)
              best=None; bestwidth=0
              for ix,url in enumerate(paths):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=15) as resp: data=resp.read()
                      im=Image.open(io.BytesIO(data));w,h=im.size
                      print(name,"try",ix,"status 200","dims",w,h,"bytes",len(data))
                      if w>bestwidth: best=(im.copy(),len(data));bestwidth=w
                      if w>=1000:break
                  except Exception as ex:print(name,'try',ix,'error',str(ex)[:150])
              if bestwidth<800:raise RuntimeError(f'Foto {name} sem qualidade suficiente; recebida resolução máxima de {bestwidth}px')
              im=best[0].convert('RGB'); im.thumbnail((1400,900)); im.save(d/(name+'.jpg'),format='JPEG',quality=88,optimize=True)
              print("SAVED",name,im.size)
          PY
      - name: Publicar
        run: |
          git config user.name "Jeri Rota"
          git config user.email "actions@users.noreply.github.com"
          git add propostas/ilisandra/quarto-duplo.jpg propostas/ilisandra/quarto-triplo.jpg
          git commit -m "Publica fotos nítidas e originais dos quartos de Ilisandra"
          git push
