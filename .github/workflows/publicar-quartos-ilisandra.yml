name: Publicar fotos reais dos quartos de Ilisandra
on:
  push:
    paths:
      - .github/workflows/publicar-quartos-ilisandra.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Salvar fotos enviadas pelo cliente no site
        env:
          URL_DUPLO: "https://media.canva.com/v2/image-resize/format:JPG/height:108/quality:75/uri:ifs%3A%2F%2FM%2Fd3082010-7f16-43ef-bafc-d95488104c3e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJ-voSmVmhhsuWjYqGgpRgpBcQiyqwjXp9fWB3fE6yON&exp=1794328592&osig=AAAAAAAAAAAAAAAAAAAAAFmIhn45RrMRVXuMzl5vo6IgDlRS2OgAUYZ7va8svC--&signer=media-rpc&token=AAIAAU0AJGQzMDgyMDEwLTdmMTYtNDNlZi1iYWZjLWQ5NTQ4ODEwNGMzZQAAAAABocZRfoBQUxatq8F4TzhqN41xEwe_7HQDTWqKjYkrkt4mnhqK7Q&x-canva-quality=thumbnail"
          URL_TRIPLO: "https://media.canva.com/v2/image-resize/format:JPG/height:149/quality:75/uri:ifs%3A%2F%2FM%2F56f051b9-ee11-4a80-9456-71ce53b4ba94/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMSIfGB8m2vVRJRaBwt7AQmaG2dK1Mm-4X3tsT3I2Gba&exp=1794330376&osig=AAAAAAAAAAAAAAAAAAAAAMTPZsHFNjIdki-e1dvLtCaqikT94cKUN0spx_9atnTy&signer=media-rpc&token=AAIAAU0AJDU2ZjA1MWI5LWVlMTEtNGE4MC05NDU2LTcxY2U1M2I0YmE5NAAAAAABocZst0CDLHEPRd5ZO8O-1-l23S8lsO4yxg85B-Ai-Am665cWIw&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
          import os, urllib.request, pathlib
          folder=pathlib.Path("propostas/ilisandra")
          for name,key in (("quarto-duplo.jpg","URL_DUPLO"),("quarto-triplo.jpg","URL_TRIPLO")):
              req=urllib.request.Request(os.environ[key],headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=40) as resp: data=resp.read()
              if len(data)<1000 or data[:3]!=b'\xff\xd8\xff': raise RuntimeError("Foto inválida "+name)
              (folder/name).write_bytes(data)
              print(name,len(data))
          PY
      - name: Publicar imagens
        run: |
          git config user.name "Jeri Rota"
          git config user.email "actions@users.noreply.github.com"
          git add propostas/ilisandra/quarto-duplo.jpg propostas/ilisandra/quarto-triplo.jpg
          git commit -m "Publica fotos reais dos quartos duplo e triplo de Ilisandra" || exit 0
          git push
